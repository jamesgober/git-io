# =============================================================================
#  R E P S   ·   git-io
# =============================================================================
[package]
name    = "git-io"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Git object model, packfiles, and smart-HTTP push/fetch in pure Rust, with no dependency on the git binary."

# Keywords (5 max)
keywords = ["git", "packfile", "vcs", "protocol", "smart-http"]

# Categories
categories = ["development-tools", "network-programming"]

# Links
homepage      = "https://github.com/jamesgober/git-io"
repository    = "https://github.com/jamesgober/git-io"
documentation = "https://docs.rs/git-io"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "git_io"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# First-party -lang dependencies are wired at v0.2.0, when first used.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
